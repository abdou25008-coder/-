<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" />

  <!-- Outer Shield Border -->
  <path d="M256 60 L410 120 C410 280 256 420 256 420 C256 420 102 280 102 120 Z" 
        fill="#0f172a" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Shield Glow -->
  <path d="M256 85 L385 135 C385 270 256 390 256 390 C256 390 127 270 127 135 Z" 
        fill="url(#shieldGrad)" opacity="0.25" />

  <!-- Car Silhouette & Digital Eye Graphic -->
  <!-- Car Roof & Windows -->
  <path d="M190 260 L215 200 L297 200 L322 260 Z" fill="url(#goldGrad)" />
  <!-- Car Body -->
  <rect x="160" y="255" width="192" height="55" rx="16" fill="#ffffff" />
  <!-- Car Wheels -->
  <circle cx="205" cy="310" r="22" fill="#020617" stroke="#10b981" stroke-width="6" />
  <circle cx="307" cy="310" r="22" fill="#020617" stroke="#10b981" stroke-width="6" />
  <!-- Headlights -->
  <circle cx="175" cy="275" r="8" fill="#fbbf24" />
  <circle cx="337" cy="275" r="8" fill="#fbbf24" />

  <!-- AI Radar Waves Above -->
  <path d="M220 155 C232 145 244 140 256 140 C268 140 280 145 292 155" 
        fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <path d="M200 135 C218 120 236 115 256 115 C276 115 294 120 312 135" 
        fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />

  <!-- App Label in Arabic at Bottom -->
  <text x="256" y="470" font-family="'Cairo', sans-serif" font-weight="900" font-size="34" 
        text-anchor="middle" fill="#ffffff" letter-spacing="1">مراقب الحملة</text>
</svg>
