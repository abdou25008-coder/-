<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>مراقب جروب الحملة - المنظومة الذكية لإدارة الحملة</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مراقب الحملة">
  <meta name="screen-orientation" content="portrait">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
    * {
      box-sizing: border-box;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #020617;
    }
    body {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .header-safe {
      padding-top: max(0.75rem, env(safe-area-inset-top, 0px));
    }
    .nav-safe {
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
    }
    .body-safe {
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen w-full m-0 p-0 overflow-x-hidden flex flex-col font-sans antialiased">

  <!-- Mobile Edge-to-Edge Dedicated App Layout (Full Screen, Zero Borders, Zero Margins) -->
  <div class="w-full min-h-screen flex-1 flex flex-col bg-slate-950 relative overflow-x-hidden">

    <!-- Global Hidden Input for WhatsApp Chat Files (_chat.txt) -->
    <input type="file" id="chatFileInput" accept=".txt" class="hidden" onchange="handleChatFileUpload(event)">

    <!-- Government Official Header Banner -->
    <header class="sticky top-0 z-30 w-full bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 border-b border-slate-800/90 header-safe px-4 pb-3 select-none">
      
      <!-- Top Meta Bar -->
      <div class="flex items-center justify-between text-[11px] text-slate-400 mb-2">
        <div class="flex items-center gap-1.5 font-bold text-amber-400">
          <span class="text-sm">🏛️</span>
          <span>قطاع النقل والخدمات الحكومية</span>
        </div>
        <div class="flex items-center gap-1 text-[10px] text-emerald-400 bg-emerald-950/70 px-2 py-0.5 rounded-full border border-emerald-500/40">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>سيرفر الحملة: 24/7</span>
        </div>
      </div>

      <!-- App Brand Title -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-950 p-0.5 shadow-md flex items-center justify-center border border-emerald-400/50">
            <span class="text-xl">🛡️</span>
          </div>
          <div>
            <h1 class="text-lg font-black text-white tracking-tight">
              مراقب جروب الحملة
            </h1>
            <p class="text-[10.5px] text-slate-400 font-medium">المنظومة الذكية لإدارة سيارات وسائقي الحملة</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="installPWA()" id="pwaInstallBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-2 py-1.5 rounded-xl text-[10.5px] flex items-center gap-1 shadow-sm border border-emerald-500/40 transition active:scale-95" title="تنزيل التطبيق على الهاتف">
            <span>📲</span>
            <span>تنزيل كـ تطبيق</span>
          </button>
          <button onclick="togglePrivacyNotice()" class="bg-slate-800/90 hover:bg-slate-700 text-amber-300 p-2 rounded-xl text-xs border border-slate-700 shadow-sm" title="معلومات المنظومة">
            ℹ️
          </button>
        </div>
      </div>

      <!-- Dynamic Header Banner (Updates on Login / Logout) -->
      <div id="headerDynamicBanner" class="mt-2 bg-slate-900/90 border border-emerald-500/35 rounded-xl px-2.5 py-1.5 shadow-sm hidden">
        <div class="flex items-center gap-1.5">
          <span class="text-emerald-400 text-xs flex-shrink-0">👁️</span>
          <div class="text-[10.5px] text-slate-300 leading-snug">
            <strong class="text-emerald-300 font-bold">محرك الرصد الذكي:</strong>
            قراءة النصوص فوراً، وتحليل صور أذون الخروج والعودة، فواتير الوقود، وقراءات عدادات السيارات.
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable Screen Content (Full Width Edge-to-Edge) -->
    <main id="appBody" class="flex-1 w-full overflow-y-auto custom-scroll p-4 space-y-4 bg-slate-950 body-safe">
      <!-- Injected via JavaScript -->
    </main>

    <!-- Native-Style Bottom Navigation Bar (Full Width Fixed, Safe-Area Supported) -->
    <nav id="appBottomNav" class="fixed bottom-0 inset-x-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800/90 grid grid-cols-5 py-2 px-1 text-center select-none z-30 shadow-2xl nav-safe">
      <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-item text-emerald-400 flex flex-col items-center py-1 transition active:scale-95">
        <span class="text-xl">🏢</span>
        <span class="text-xs font-bold mt-0.5">الحملة</span>
      </button>
      <button onclick="switchTab('vehicles')" id="tab-vehicles" class="nav-item text-slate-400 flex flex-col items-center py-1 transition active:scale-95">
        <span class="text-xl">🚗</span>
        <span class="text-xs font-semibold mt-0.5">السيارات</span>
      </button>
      <button onclick="switchTab('fuel')" id="tab-fuel" class="nav-item text-slate-400 flex flex-col items-center py-1 transition active:scale-95">
        <span class="text-xl">⛽</span>
        <span class="text-xs font-semibold mt-0.5">الوقود</span>
      </button>
      <button onclick="switchTab('hr')" id="tab-hr" class="nav-item text-slate-400 flex flex-col items-center py-1 transition active:scale-95">
        <span class="text-xl">👔</span>
        <span class="text-xs font-semibold mt-0.5">السائقين</span>
      </button>
      <button onclick="switchTab('control')" id="tab-control" class="nav-item text-slate-400 flex flex-col items-center py-1 transition active:scale-95">
        <span class="text-xl">⚙️</span>
        <span class="text-xs font-semibold mt-0.5">التحكم</span>
      </button>
    </nav>

  </div>

  <!-- Modal Dialog for Edit / Register (Vehicles & Drivers) -->
  <div id="crudModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 select-none">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl p-4 space-y-3 animate-in fade-in zoom-in-95 duration-150">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-xs font-bold text-white flex items-center gap-1.5">
          <span>✏️</span>
          <span id="crudModalTitleText">تعديل وتصحيح البيانات</span>
        </h3>
        <button onclick="closeCrudModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2 py-0.5 rounded-lg">&times;</button>
      </div>
      
      <div id="crudModalBody" class="space-y-2.5 text-xs text-slate-300 max-h-[75vh] overflow-y-auto custom-scroll pr-1">
        <!-- Dynamically injected -->
      </div>
    </div>
  </div>

  <script>
    // State of the Fleet & Campaign
    const appState = {
      currentTab: 'dashboard',
      session: {
        isLoggedIn: false,
        groupName: 'جروب حركة وسيارات الحملة المركزية',
        adminPhone: '01092519210',
        groupLink: '',
        keepLoggedIn: true,
        loginTime: null
      },
      vehicles: [
        { 
          plate: '102 حكومي', 
          type: 'ميكروباص خدمة', 
          model: 'تويوتا هايس', 
          km: 48500, 
          status: 'في مأمورية', 
          driver: 'أحمد مصطفى', 
          lastOilKm: 45000, 
          oilInterval: 5000, 
          fuelRate: 10.4 
        },
        { 
          plate: '4589 ب س ج', 
          type: 'سيارة قيادة', 
          model: 'نيسان صني', 
          km: 124500, 
          status: 'في مأمورية', 
          driver: 'مصطفى علي', 
          lastOilKm: 120000, 
          oilInterval: 5000, 
          fuelRate: 12.8 
        },
        { 
          plate: '305 حكومي', 
          type: 'نقل بضائع', 
          model: 'شيفروليه جامبو', 
          km: 89300, 
          status: 'في الورشة', 
          driver: 'محمود خالد', 
          lastOilKm: 83000, 
          oilInterval: 5000, 
          fuelRate: 7.2 
        },
        { 
          plate: '714 حكومي', 
          type: 'مأموريات إدارية', 
          model: 'رينو لوجان', 
          km: 62100, 
          status: 'بمقر الحملة', 
          driver: 'سامح حسن', 
          lastOilKm: 60000, 
          oilInterval: 5000, 
          fuelRate: 11.5 
        }
      ],
      drivers: [
        { name: 'أحمد مصطفى', phone: '01012345678', car: '102 حكومي', days: 22, activeToday: true, totalKm: 3420 },
        { name: 'مصطفى علي', phone: '01198765432', car: '4589 ب س ج', days: 20, activeToday: true, totalKm: 2890 },
        { name: 'محمود خالد', phone: '01234567890', car: '305 حكومي', days: 18, activeToday: false, totalKm: 1950 },
        { name: 'سامح حسن', phone: '01511223344', car: '714 حكومي', days: 15, activeToday: false, totalKm: 1620 }
      ],
      maintenance: [
        { id: 1, plate: '305 حكومي', issue: 'فحص دورة الفرامل وتغيير التيل الأمامي', severity: 'عاجل', status: 'جاري الإصلاح' }
      ],
      fuelLogs: [
        { plate: '102 حكومي', liters: 40, cost: 520, rate: 10.5, abnormal: false, date: 'اليوم 09:15 ص' },
        { plate: '305 حكومي', liters: 65, cost: 845, rate: 6.2, abnormal: true, date: 'أمس 04:30 م' }
      ],
      settings: {
        isSilent: true, // Silent mode active by default
        replyInGroup: false,
        managerPhone: '01092519210',
        activeHours: '24/7',
        replyScope: 'manager_only',
        replyTemplate: 'formal',
        // Bot Reading & Vision Permissions
        readOdometers: true,
        readWaybills: true,
        readFuelReceipts: true,
        readFaults: true,
        readHRAttendance: true,
        // Private Alerts to Manager WhatsApp
        alertFuelWaste: true,
        alertOilDue: true,
        alertUrgentBreakdown: true,
        // Suggested Interactive Reply Templates
        replyExitText: '✅ تم توثيق خروج [ {اللوحة} ] - عداد {العداد} كم. رافقتكم السلامة.',
        replyReturnText: '🏁 تم توثيق عودة [ {اللوحة} ] - المسافة {المسافة} كم. حمداً لله على السلامة.',
        replyFuelText: '⛽ تم تسجيل استلام بون وقود لسيارة [ {اللوحة} ] - {اللترات} لتر.'
      }
    };

    function switchTab(tab) {
      appState.currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.remove('text-emerald-400');
        el.classList.add('text-slate-400');
      });
      document.getElementById('tab-' + tab).classList.add('text-emerald-400');
      document.getElementById('tab-' + tab).classList.remove('text-slate-400');
      render();
    }

    function render() {
      const body = document.getElementById('appBody');
      const banner = document.getElementById('headerDynamicBanner');
      const nav = document.getElementById('appBottomNav');

      // 1. Check Login & Group Reading Gate (Landing Page if not logged in)
      if (!appState.session.isLoggedIn) {
        if (nav) nav.classList.add('hidden');
        if (banner) {
          banner.classList.add('hidden');
          banner.innerHTML = '';
        }
        body.innerHTML = renderLoginAndGroupConnectScreen();
        return;
      }

      // When Logged In
      if (nav) nav.classList.remove('hidden');
      if (banner) {
        banner.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
              <div class="truncate">
                <span class="text-xs text-slate-400">الجروب:</span>
                <span class="text-xs text-emerald-300 font-bold mr-1 truncate">${appState.session.groupName}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button onclick="openQuickPermitModal()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg font-bold flex items-center gap-1 transition shadow active:scale-95" title="إرسال إذن حركة رسمي لجروب الواتساب">
                <span>📲</span>
                <span>إذن حركة</span>
              </button>
              <button onclick="confirmLogoutGroup()" class="text-xs bg-rose-950/90 hover:bg-rose-900 text-rose-300 border border-rose-800/80 px-2 py-1 rounded-lg font-bold flex items-center gap-1 transition shadow active:scale-95" title="تسجيل الخروج لمتابعة جروب آخر">
                <span>🚪</span>
                <span>خروج</span>
              </button>
            </div>
          </div>
        `;
      }

      // --- 1. DASHBOARD TAB ---
      if (appState.currentTab === 'dashboard') {
        const onDuty = appState.vehicles.filter(v => v.status === 'في مأمورية').length;
        const inShop = appState.vehicles.filter(v => v.status === 'في الورشة').length;

        body.innerHTML = `
          <!-- Active Connected Group Reading Status (First Primary Item) -->
          <div class="bg-gradient-to-r from-slate-900 via-slate-900 to-emerald-950/50 border border-emerald-500/50 p-3 rounded-2xl shadow-md space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 flex-shrink-0 text-base">
                  📡
                </div>
                <div class="min-w-0">
                  <div class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>الجروب قيد القراءة والمتابعة الآن:</span>
                  </div>
                  <div class="text-xs font-black text-white truncate">${appState.session.groupName}</div>
                </div>
              </div>
              <button onclick="confirmLogoutGroup()" class="bg-rose-950/90 hover:bg-rose-900 text-rose-300 hover:text-white border border-rose-700/60 text-[10.5px] font-bold px-2.5 py-1.5 rounded-xl transition active:scale-95 flex items-center gap-1 shadow flex-shrink-0" title="تسجيل الخروج لمتابعة جروب آخر">
                <span>🚪</span>
                <span>تسجيل الخروج</span>
              </button>
            </div>
            <div class="grid grid-cols-3 gap-1.5 text-center text-[10px] pt-1.5 border-t border-slate-800/80">
              <div class="bg-slate-950/80 p-1.5 rounded-lg border border-slate-800">
                <div class="text-slate-400">حالة الرصد</div>
                <div class="text-emerald-400 font-bold">🟢 متصل ويقرأ</div>
              </div>
              <div class="bg-slate-950/80 p-1.5 rounded-lg border border-slate-800">
                <div class="text-slate-400">مشرف الجروب</div>
                <div class="text-white font-mono font-bold truncate">${appState.session.adminPhone || '01092519210'}</div>
              </div>
              <div class="bg-slate-950/80 p-1.5 rounded-lg border border-slate-800">
                <div class="text-slate-400">تذكر الدخول</div>
                <div class="text-amber-400 font-bold">${appState.session.keepLoggedIn ? 'مفعل دائماً' : 'جلسة مؤقتة'}</div>
              </div>
            </div>
          </div>

          <!-- Quick WhatsApp Action Banner (For Drivers & Any Member) -->
          <div class="bg-gradient-to-r from-emerald-950/90 via-slate-900 to-teal-950/90 border border-emerald-500/50 p-3.5 rounded-2xl shadow-md flex items-center justify-between gap-2.5">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl flex-shrink-0">
                📲
              </div>
              <div class="min-w-0">
                <div class="text-xs font-black text-white truncate">إذن حركة رسمي فوري لواتساب</div>
                <div class="text-[11px] text-slate-300 truncate">توثيق خروج/عودة/وقود وإرساله للجروب فوراً</div>
              </div>
            </div>
            <button onclick="openQuickPermitModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 px-3 rounded-xl flex items-center gap-1.5 shadow-lg transition active:scale-95 whitespace-nowrap flex-shrink-0">
              <span>✍️</span>
              <span>تسجيل حركة</span>
            </button>
          </div>

          <!-- Quick Campaign Metrics -->
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-slate-900 border border-slate-800/90 p-3 rounded-2xl shadow-sm text-center">
              <div class="text-[11px] text-slate-400 font-semibold">إجمالي سيارات الحملة</div>
              <div class="text-2xl font-black text-white mt-0.5">${appState.vehicles.length} <span class="text-xs font-normal text-slate-400">مركبة</span></div>
            </div>
            <div class="bg-slate-900 border border-slate-800/90 p-3 rounded-2xl shadow-sm text-center">
              <div class="text-[11px] text-slate-400 font-semibold">في مأمورية الآن</div>
              <div class="text-2xl font-black text-emerald-400 mt-0.5">${onDuty} <span class="text-xs font-normal text-slate-400">سيارات</span></div>
            </div>
            <div class="bg-slate-900 border border-slate-800/90 p-3 rounded-2xl shadow-sm text-center">
              <div class="text-[11px] text-slate-400 font-semibold">في ورشة الصيانة</div>
              <div class="text-2xl font-black text-rose-400 mt-0.5">${inShop} <span class="text-xs font-normal text-slate-400">سيارة</span></div>
            </div>
            <div class="bg-slate-900 border border-slate-800/90 p-3 rounded-2xl shadow-sm text-center">
              <div class="text-[11px] text-slate-400 font-semibold">سائقين مسجلين اليوم</div>
              <div class="text-2xl font-black text-amber-400 mt-0.5">${appState.drivers.filter(d => d.activeToday).length} <span class="text-xs font-normal text-slate-400">سائق</span></div>
            </div>
          </div>

          <!-- Urgent Fleet Alerts -->
          ${appState.maintenance.length > 0 ? `
            <div class="bg-rose-950/30 border border-rose-800/60 rounded-2xl p-3 shadow-md">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-rose-300 flex items-center gap-1.5">
                  <span class="text-base">🚨</span> إخطارات الصيانة الفنية العاجلة
                </span>
                <span class="text-[10px] bg-rose-900/80 text-rose-200 px-2 py-0.5 rounded-full font-bold">متابعة فورية</span>
              </div>
              ${appState.maintenance.map(m => `
                <div class="bg-slate-950/80 border border-rose-900/40 p-2.5 rounded-xl flex items-center justify-between mt-1.5 gap-2">
                  <div class="flex-1 min-w-0">
                    <div class="font-bold text-xs text-rose-200 truncate">مركبة [ ${m.plate} ]</div>
                    <div class="text-[11px] text-slate-300 mt-0.5 line-clamp-1">${m.issue}</div>
                  </div>
                  <button onclick="resolveMaintenance(${m.id})" class="text-[10.5px] bg-rose-700 hover:bg-rose-600 text-white font-bold px-2.5 py-1.5 rounded-lg transition active:scale-95 shadow whitespace-nowrap flex-shrink-0">
                    تم الإصلاح
                  </button>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <!-- Live Fleet Status (Optimized Alignment & Hierarchy) -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between text-xs text-slate-300 font-bold px-1">
              <span class="flex items-center gap-1.5">
                <span>🚗</span> موقف سيارات الحملة المباشر
              </span>
              <span class="text-[10px] text-emerald-400 font-medium">تحديث آلي</span>
            </div>

            ${appState.vehicles.map(v => {
              const badgeStyle = v.status === 'في مأمورية' 
                ? 'bg-emerald-950 text-emerald-300 border-emerald-500/50' 
                : (v.status === 'في الورشة' 
                  ? 'bg-rose-950 text-rose-300 border-rose-500/50' 
                  : 'bg-slate-800 text-slate-300 border-slate-700');

              return `
                <div class="bg-slate-900/90 border border-slate-800/90 p-3 rounded-2xl shadow-sm hover:border-slate-700 transition">
                  <!-- Header Row: Plate & Status -->
                  <div class="flex items-center justify-between pb-2 border-b border-slate-800/80 gap-2">

    // Live Cloud Data Synchronization
    async function syncFromCloud() {
      try {
        const res = await fetch('/api/dashboard');
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            const statusEl = document.getElementById('cloudStatusText');
            if (statusEl) statusEl.textContent = 'سحابي مباشر 24/7 (متصل)';
            
            // Sync Vehicles
            const vRes = await fetch('/api/vehicles');
            if (vRes.ok) {
              const vData = await vRes.json();
              if (vData.vehicles && vData.vehicles.length > 0) {
                appState.vehicles = vData.vehicles.map(v => ({
                  plate: v.plate,
                  type: v.type || 'خدمة',
                  model: v.model || '',
                  km: v.current_km || 0,
                  status: v.status || 'بمقر الحملة',
                  driver: v.current_driver || 'غير محدد',
                  lastOilKm: v.last_oil_km || 0,
                  oilInterval: v.oil_change_interval || 5000,
                  fuelRate: v.avg_fuel_consumption || 10.4
                }));
              }
            }

            // Sync Drivers
            const dRes = await fetch('/api/drivers');
            if (dRes.ok) {
              const dData = await dRes.json();
              if (dData.drivers && dData.drivers.length > 0) {
                appState.drivers = dData.drivers.map(d => ({
                  name: d.name,
                  phone: d.phone || '',
                  car: d.current_vehicle || 'مركبة الحملة',
                  days: d.actual_work_days || 0,
                  activeToday: d.today_trips_count > 0,
                  totalKm: d.monthly_total_km || 0
                }));
              }
            }

            render();
          }
        }
      } catch (err) {
        // Standalone or offline mode
      }
    }

    function loadGroupSession() {
      try {
        const saved = localStorage.getItem('fleet_group_session');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.isLoggedIn) {
            appState.session = Object.assign(appState.session, parsed);
            return;
          }
        }
        const temp = sessionStorage.getItem('fleet_group_session');
        if (temp) {
          const parsed = JSON.parse(temp);
          if (parsed && parsed.isLoggedIn) {
            appState.session = Object.assign(appState.session, parsed);
            return;
          }
        }
      } catch (e) {}
    }

    // --- 1. DOWNLOAD BOT VCARD (Add Bot to WhatsApp Group) ---
    function downloadBotVCard() {
      const vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\nFN:مراقب جروب الحملة الذكي\r\nTEL;TYPE=CELL,VOICE:+201092519210\r\nORG:قطاع النقل والخدمات الحكومية\r\nTITLE:بوت رصد الحركة والعدادات 24/7\r\nNOTE:أضف هذا الرقم إلى جروب حركة الحملة لتفعيل الرصد التلقائي للأذون والعدادات 24/7\r\nEND:VCARD";
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'مراقب_الحملة_الذكي.vcf';
      document.body.appendChild(a);
      a.click();

      let icon = '🚗';

    // --- 4. CHAT FILE IMPORT & DIRECT PARSER ---
    function triggerChatFileSelect() {
      const input = document.getElementById('chatFileInput');
      if (input) input.click();
    }

    function handleChatFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        parseAndImportWhatsAppChat(text);
      };
      reader.readAsText(file, 'UTF-8');
    }

    function parseFromPasteBox() {
      const text = document.getElementById('chatPasteArea').value;
      parseAndImportWhatsAppChat(text);
    }

    function parseAndImportWhatsAppChat(text) {
      if (!text || text.trim().length === 0) {
        alert('يرجى اختيار ملف الشات أو لصق رسائل من جروب الواتساب أولاً.');
        return;
      }

      const lines = text.split('\n');
      let matchedLines = 0;
      let odoUpdated = 0;
      let statusUpdated = 0;
      let fuelAdded = 0;

      lines.forEach(line => {
        const clean = line.trim();
        if (!clean) return;

        // Check vehicles
        appState.vehicles.forEach(v => {
          const p = v.plate.replace(/\s+/g, '');
          const cl = clean.replace(/\s+/g, '');
          if (cl.includes(p) || clean.includes(v.plate)) {
            matchedLines++;

            // Check odometer: e.g. عداد 48500 or 48500 كم
            const kmMatch = clean.match(/(?:عداد|km|كيلو|المسافة)[:\s]*([0-9]{3,7})/i) || clean.match(/([0-9]{4,6})\s*(?:كم|km)/i);
            if (kmMatch && kmMatch[1]) {
              const kmVal = parseInt(kmMatch[1], 10);
              if (kmVal > v.km) {
                v.km = kmVal;
                odoUpdated++;
              }
            }

            // Check status: exit
            if (clean.includes('خروج') || clean.includes('مأمورية') || clean.includes('انطلاق')) {
              v.status = 'في مأمورية';
              statusUpdated++;
            } else if (clean.includes('عودة') || clean.includes('رجوع') || clean.includes('بالمقر')) {
              v.status = 'بمقر الحملة';
              statusUpdated++;
            } else if (clean.includes('عطل') || clean.includes('ورشة') || clean.includes('فرامل')) {
              v.status = 'في الورشة';
              statusUpdated++;
            }
          }
        });

        // Check fuel: e.g. بون وقود 40 لتر
        const fuelMatch = clean.match(/(?:بون|وقود|بنزين|سولار)[:\s]*([0-9]{1,3})\s*(?:لتر|L)/i);
        if (fuelMatch && fuelMatch[1]) {
          fuelAdded++;
        }
      });

      // Auto login if not logged in
      appState.session.isLoggedIn = true;
      appState.session.keepLoggedIn = true;
      saveFleetDataLocally();
      try {
        localStorage.setItem('fleet_group_session', JSON.stringify(appState.session));
      } catch (e) {}

      render();
      alert(`✅ تم قراءة وتحليل شات جروب الواتساب بنجاح!\n\n• رسائل مرتبطة بسيارات الأسطول: ${matchedLines}\n• عدادات محدثة: ${odoUpdated}\n• حالات حركة وأذون خروج: ${statusUpdated}\n• بونات وقود ملتقطة: ${fuelAdded}\n\nتم فتح لوحة تحكم الحملة ومزامنة البيانات.`);
    }

    function saveVehicleCorrection(origPlate) {
      const v = appState.vehicles.find(x => x.plate === origPlate);
      if (!v) return;
      const newPlate = document.getElementById('mPlate').value.trim();
      const newKm = parseInt(document.getElementById('mKm').value, 10) || 0;
      const newLastOil = parseInt(document.getElementById('mLastOil').value, 10) || 0;
      const newModel = document.getElementById('mModel').value.trim();
      const newType = document.getElementById('mType').value.trim();
      const newDriver = document.getElementById('mDriver').value.trim();
      const newStatus = document.getElementById('mStatus').value;

      if (!newPlate) {
        alert('يرجى كتابة رقم لوحة السيارة');
        return;
      }

      v.plate = newPlate;
      v.km = newKm;
      v.lastOilKm = newLastOil;
      v.model = newModel;
      v.type = newType;
      v.driver = newDriver;
      v.status = newStatus;

      saveFleetDataLocally();
      closeCrudModal();
      render();
      alert(`✅ تم حفظ وتصحيح بيانات المركبة [ ${newPlate} ] بنجاح.`);
    }

    function saveNewVehicle() {
      const plate = document.getElementById('mPlate').value.trim();
      if (!plate) {
        alert('يرجى إدخال رقم اللوحة');
        return;
      }
      const km = parseInt(document.getElementById('mKm').value, 10) || 0;
      const lastOil = parseInt(document.getElementById('mLastOil').value, 10) || km;
      const model = document.getElementById('mModel').value.trim() || 'سيارة حملة';
      const type = document.getElementById('mType').value.trim() || 'خدمة';
      const driver = document.getElementById('mDriver').value.trim() || 'غير محدد';
      const status = document.getElementById('mStatus').value;

      appState.vehicles.unshift({
        plate,
        km,
        lastOilKm: lastOil,
        model,
        type,
        driver,
        status,
        oilInterval: 5000,
        fuelRate: 10.4
      });

      saveFleetDataLocally();
      closeCrudModal();
      render();
      alert(`✅ تم تسجيل المركبة الجديدة [ ${plate} ] بالأسطول بنجاح.`);
    }

    function deleteVehicleItem(plate) {
      if (!confirm(`هل أنت متأكد من حذف المركبة [ ${plate} ] من المنظومة؟`)) return;
      appState.vehicles = appState.vehicles.filter(x => x.plate !== plate);
      saveFleetDataLocally();
      closeCrudModal();
      render();
    }

    function saveDriverCorrection(origName) {
      const d = appState.drivers.find(x => x.name === origName);
      if (!d) return;
      const newName = document.getElementById('mDriverName').value.trim();
      const newPhone = document.getElementById('mDriverPhone').value.trim();
      const newCar = document.getElementById('mDriverCar').value.trim();
      const newDays = parseInt(document.getElementById('mDriverDays').value, 10) || 0;
      const newTotalKm = parseInt(document.getElementById('mDriverTotalKm').value, 10) || 0;

      if (!newName) {
        alert('يرجى كتابة اسم السائق');
        return;
      }

      d.name = newName;
      d.phone = newPhone;
      d.car = newCar;
      d.days = newDays;
      d.totalKm = newTotalKm;

      saveFleetDataLocally();
      closeCrudModal();
      render();
      alert(`✅ تم حفظ وتعديل بيانات السائق [ ${newName} ] بنجاح.`);
    }

    function saveNewDriver() {
      const name = document.getElementById('mDriverName').value.trim();
      if (!name) {
        alert('يرجى إدخال اسم السائق');
        return;
      }
      const phone = document.getElementById('mDriverPhone').value.trim() || '01000000000';
      const car = document.getElementById('mDriverCar').value.trim() || 'غير محدد';
      const days = parseInt(document.getElementById('mDriverDays').value, 10) || 0;
      const totalKm = parseInt(document.getElementById('mDriverTotalKm').value, 10) || 0;

      appState.drivers.unshift({
        name,
        phone,
        car,
        days,
        totalKm,
        activeToday: false
      });

      saveFleetDataLocally();
      closeCrudModal();
      render();
      alert(`✅ تم تسجيل السائق الجديد [ ${name} ] بنجاح.`);
    }

    function deleteDriverItem(name) {
      if (!confirm(`هل أنت متأكد من حذف السائق [ ${name} ] من المنظومة؟`)) return;
      appState.drivers = appState.drivers.filter(x => x.name !== name);
      saveFleetDataLocally();
      closeCrudModal();
      render();
    }

    // Check for incoming Web Share Target from WhatsApp
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedText = urlParams.get('text') || urlParams.get('title') || urlParams.get('url');
      if (sharedText) {
        parseAndImportWhatsAppChat(sharedText);
      }
    } catch(e) {}

    // Initial load
    render();
  </script>
